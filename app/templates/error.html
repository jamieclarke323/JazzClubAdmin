{% extends "base.html" %}
{% block bodyclass %}auth-page{% endblock %}
{% block content %}
<div class="auth-card card center">
  <h2>{{ error.code if error.code else 'Error' }}</h2>
  <p class="muted">{{ error.description if error.description else 'Something went wrong.' }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Go home</a>
</div>
{% endblock %}
