<li class="item {% if i.is_checked %}is-checked{% endif %}" data-id="{{ i.id }}" data-item='{{ i.to_dict() | tojson }}'>
  <button class="check" type="button" aria-label="{{ 'Put back on list' if i.is_checked else 'Tick off' }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
  </button>
  <div class="item-body" role="button" tabindex="0">
    <span class="item-name">{{ i.name }}</span>
    {% if i.quantity %}<span class="qty">× {{ i.quantity }}</span>{% endif %}
    {% if not grouped and i.category != 'groceries' %}<span class="meta pill">{{ i.category }}</span>{% endif %}
  </div>
  <button class="iconbtn edit" type="button" aria-label="Edit {{ i.name }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>
</li>
