{% extends "base.html" %}
{% block header_title %}Info{% endblock %}
{% block content %}
<section class="quickadd card">
  <form id="info-add" autocomplete="off" enctype="multipart/form-data">
    <div class="quickadd-row">
      <input id="info-title" name="title" class="input input-lg" type="text" placeholder="Add info… e.g. Spain flights" maxlength="120" enterkeyhint="done" autocapitalize="sentences" required>
      <label class="iconbtn filebtn" id="info-attach-btn" aria-label="Attach photo or PDF" title="Attach photo or PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <input type="file" name="files" id="info-files" accept="image/*,application/pdf" multiple hidden>
        <b class="badge" id="info-files-count" hidden>0</b>
      </label>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
    <div id="info-previews" class="previews" hidden></div>
    <textarea class="input" name="notes" id="info-notes" rows="2" maxlength="5000" placeholder="Notes (optional) — booking refs, dates, passwords…" style="margin-top:8px"></textarea>
  </form>
</section>

<div class="searchrow">
  <input id="info-search" class="input" type="search" placeholder="Search info…" autocomplete="off">
</div>

<div id="info-board" data-list-url="{{ url_for('info.list_partial') }}" data-version-url="{{ url_for('info.version') }}">
  {% include "info/_board.html" %}
</div>

<dialog id="info-sheet" class="sheet">
  <form id="info-edit" class="sheet-body stack" method="dialog" enctype="multipart/form-data">
    <div class="sheet-handle"></div>
    <input type="hidden" name="id">
    <input class="input input-lg" type="text" name="title" maxlength="120" required aria-label="Title">
    <textarea class="input" name="notes" rows="4" maxlength="5000" placeholder="Notes"></textarea>
    <div class="field-row">
      <span class="field-label">Attachments</span>
      <div id="edit-attachments" class="attach-list"></div>
      <label class="btn btn-ghost filebtn-wide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Add photos or PDFs
        <input type="file" name="files" accept="image/*,application/pdf" multiple hidden>
      </label>
      <div id="edit-previews" class="previews" hidden></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-danger btn-ghost" type="button" id="info-delete">Delete</button>
      <span class="spacer"></span>
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="lightbox" class="lightbox">
  <button class="lightbox-close" type="button" data-close aria-label="Close">✕</button>
  <img alt="" id="lightbox-img">
  <a id="lightbox-download" class="btn" href="#" download>Download</a>
</dialog>
{% endblock %}
{% block scripts %}<script src="{{ static_url('js/info.js') }}"></script>{% endblock %}
